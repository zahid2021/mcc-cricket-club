services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mcc
      POSTGRES_PASSWORD: mcc_secret
      POSTGRES_DB: mcc
    ports:
      - "5432:5432"
    volumes:
      - mcc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcc -d mcc"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://mcc:mcc_secret@db:5432/mcc
      JWT_SECRET_KEY: change-me-in-production
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      - api

volumes:
  mcc_pg:
