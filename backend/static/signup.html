<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up | Mustafa Cricket Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#F5C518; --neon:#7CFF3A; --dark:#06140a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh; font-family: "DM Sans", system-ui, sans-serif;
      background: var(--dark);
      background-image: radial-gradient(ellipse at 50% 0%, rgba(57,255,20,.15), transparent 55%);
      color: #fff; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .wrap { width: 100%; max-width: 32rem; }
    .brand { text-align: center; margin-bottom: 1.25rem; }
    .badge {
      width: 3.5rem; height: 3.5rem; border-radius: 999px; margin: 0 auto; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--gold), #E8A317); color: var(--dark);
      font-family: "Bebas Neue", sans-serif; font-size: 1.35rem;
    }
    .brand h1 { margin-top: 1rem; font-family: "Bebas Neue", sans-serif; font-size: 2.2rem; }
    .card { border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); padding: 1.35rem; border-radius: 4px; }
    label { display: block; font-family: Oswald, sans-serif; font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.5); margin-bottom: .35rem; }
    input, select, textarea {
      width: 100%; padding: .65rem .8rem; margin-bottom: .8rem; border: 1px solid rgba(255,255,255,.15);
      border-radius: 3px; background: rgba(0,0,0,.4); color: #fff; font-size: .95rem; outline: none;
    }
    select option { color: #000; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    button { width: 100%; padding: .85rem; border: 0; border-radius: 3px; cursor: pointer; background: var(--gold); color: var(--dark); font-family: Oswald, sans-serif; letter-spacing: .15em; text-transform: uppercase; }
    button:hover { background: var(--neon); }
    button:disabled { opacity: .6; }
    .err { display: none; margin-bottom: .9rem; padding: .65rem; border: 1px solid rgba(239,68,68,.45); background: rgba(239,68,68,.12); color: #fecaca; font-size: .85rem; border-radius: 3px; }
    .err.show { display: block; }
    .switch { margin-top: 1rem; text-align: center; font-size: .85rem; color: rgba(255,255,255,.55); }
    .switch a { color: var(--gold); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="badge">MCC</div>
      <h1>CREATE ACCOUNT</h1>
      <p style="color:rgba(255,255,255,.55);font-size:.85rem;margin-top:.35rem">Senior / Junior · Role · Contact details</p>
    </div>
    <form class="card" id="form">
      <div class="err" id="err"></div>
      <label>Full name</label>
      <input id="full_name" required minlength="2" placeholder="Your full name" />
      <label>Email</label>
      <input id="email" type="email" required placeholder="you@gmail.com" />
      <div class="row2">
        <div>
          <label>Phone</label>
          <input id="phone" type="tel" placeholder="+92…" />
        </div>
        <div>
          <label>Jersey no.</label>
          <input id="jersey_number" type="number" min="1" max="99" placeholder="7" />
        </div>
      </div>
      <label>Address</label>
      <textarea id="address" rows="2" placeholder="City / area"></textarea>
      <div class="row2">
        <div>
          <label>Category</label>
          <select id="category" required>
            <option value="senior">Senior</option>
            <option value="junior">Junior</option>
          </select>
        </div>
        <div>
          <label>Team</label>
          <select id="team_slug" required></select>
        </div>
      </div>
      <label>Playing role</label>
      <select id="playing_role" required>
        <option value="batsman">Batsman</option>
        <option value="bowler">Bowler</option>
        <option value="all_rounder">All-rounder</option>
        <option value="wicketkeeper">Wicketkeeper / Keeper</option>
      </select>
      <label>Password</label>
      <input id="password" type="password" required minlength="6" />
      <label>Confirm password</label>
      <input id="confirm_password" type="password" required minlength="6" />
      <button type="submit" id="submit">Sign up</button>
      <p class="switch">Already have an account? <a href="/login">Login</a></p>
      <p class="switch" style="margin-top:.5rem"><a href="/policy">Tournament Policy — EN + اردو</a></p>
    </form>
  </div>
  <script>
    const SENIOR = [
      { slug: "senior-1st-xi", name: "Senior 1st XI" },
      { slug: "senior-2nd-xi", name: "Senior 2nd XI" },
      { slug: "development", name: "Development Team" },
    ];
    const JUNIOR = [
      { slug: "u19", name: "U19" },
      { slug: "u16", name: "U16" },
      { slug: "u14", name: "U14" },
      { slug: "u12", name: "U12" },
    ];
    const cat = document.getElementById("category");
    const teamSel = document.getElementById("team_slug");
    function fillTeams() {
      const list = cat.value === "junior" ? JUNIOR : SENIOR;
      teamSel.innerHTML = list.map(t => `<option value="${t.slug}">${t.name}</option>`).join("");
    }
    cat.addEventListener("change", fillTeams);
    fillTeams();

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      const btn = document.getElementById("submit");
      err.classList.remove("show");
      const password = document.getElementById("password").value;
      const confirm_password = document.getElementById("confirm_password").value;
      if (password !== confirm_password) {
        err.textContent = "Passwords do not match";
        err.classList.add("show");
        return;
      }
      btn.disabled = true;
      btn.textContent = "Creating…";
      const jersey = document.getElementById("jersey_number").value;
      const body = {
        full_name: document.getElementById("full_name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim() || null,
        address: document.getElementById("address").value.trim() || null,
        category: cat.value,
        team_slug: teamSel.value,
        playing_role: document.getElementById("playing_role").value,
        jersey_number: jersey ? Number(jersey) : null,
        password,
        confirm_password,
      };
      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const detail = data.detail;
          err.textContent = typeof detail === "string" ? detail : (Array.isArray(detail) ? detail.map(d => d.msg).join(", ") : "Signup failed");
          err.classList.add("show");
          return;
        }
        location.replace("/login?registered=1&email=" + encodeURIComponent(data.email || body.email));
      } catch (ex) {
        err.textContent = "Unable to reach server.";
        err.classList.add("show");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign up";
      }
    });
  </script>
</body>
</html>
