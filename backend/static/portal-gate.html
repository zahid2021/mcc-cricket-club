<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Player Portal | MCC</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#F5C518; --neon:#7CFF3A; --dark:#06140a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh; font-family: "DM Sans", system-ui, sans-serif; color: #fff;
      background: var(--dark);
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(57,255,20,.12), transparent 55%),
        radial-gradient(ellipse at 80% 100%, rgba(245,197,24,.08), transparent 40%);
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .wrap { width: 100%; max-width: 26rem; text-align: center; }
    .badge {
      width: 3.5rem; height: 3.5rem; border-radius: 999px; margin: 0 auto;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--gold), #E8A317);
      color: var(--dark); font-family: "Bebas Neue", sans-serif; font-size: 1.35rem;
    }
    h1 { margin-top: 1rem; font-family: "Bebas Neue", sans-serif; font-size: 2.2rem; letter-spacing: .04em; }
    p { margin-top: .5rem; color: rgba(255,255,255,.55); font-size: .9rem; line-height: 1.5; }
    .steps { margin: 1.25rem 0; text-align: left; font-size: .85rem; color: rgba(255,255,255,.65); line-height: 1.7; }
    .steps b { color: var(--gold); }
    .actions { display: grid; gap: .7rem; margin-top: 1.25rem; }
    a.btn {
      display: block; padding: .85rem; border-radius: 3px; text-decoration: none;
      font-family: Oswald, sans-serif; letter-spacing: .12em; text-transform: uppercase; font-size: .85rem;
    }
    .btn-gold { background: var(--gold); color: var(--dark); }
    .btn-gold:hover { background: var(--neon); }
    .btn-outline { border: 1px solid rgba(255,255,255,.25); color: #fff; }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .home { display: inline-block; margin-top: 1.25rem; color: rgba(255,255,255,.4); text-decoration: none; font-size: .8rem; }
    .home:hover { color: var(--gold); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">MCC</div>
    <h1>PLAYER PORTAL</h1>
    <p>Pehle account banao ya login karo. Phir aapki profile dikhegi. Edit alag button se hoga.</p>
    <div class="steps">
      <div><b>1.</b> Create account / Login</div>
      <div><b>2.</b> Apni Profile dekho</div>
      <div><b>3.</b> Edit Profile → save → wapas profile</div>
    </div>
    <div class="actions">
      <a class="btn btn-gold" href="/login?next=/portal/player">Login</a>
      <a class="btn btn-outline" href="/signup">Create Account</a>
    </div>
    <a class="home" href="/">← Back to public site</a>
  </div>
  <script>
    // Already logged in → seedha profile (view), edit form nahi
    (async function () {
      const t = localStorage.getItem("mcc_access_token");
      if (!t) return;
      try {
        let res = await fetch("/api/auth/me", { headers: { Authorization: "Bearer " + t } });
        if (res.status === 401) {
          const rt = localStorage.getItem("mcc_refresh_token");
          if (!rt) return;
          const rr = await fetch("/api/auth/refresh", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ refresh_token: rt }),
          });
          if (!rr.ok) return;
          const d = await rr.json();
          localStorage.setItem("mcc_access_token", d.access_token);
          if (d.refresh_token) localStorage.setItem("mcc_refresh_token", d.refresh_token);
          res = await fetch("/api/auth/me", { headers: { Authorization: "Bearer " + d.access_token } });
        }
        if (res.ok) location.replace("/portal/player");
      } catch (e) {}
    })();
  </script>
</body>
</html>
