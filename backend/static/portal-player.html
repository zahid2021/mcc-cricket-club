<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Player Portal | MCC</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#F5C518; --neon:#7CFF3A; --dark:#06140a; --night:#0a1f10; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "DM Sans", system-ui, sans-serif; background: var(--dark); color: #fff; min-height: 100svh; padding-bottom: 4.5rem; }
    header { position: sticky; top: 0; z-index: 40; height: 3.5rem; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; background: rgba(10,31,16,.95); border-bottom: 1px solid rgba(255,255,255,.1); }
    .logo { font-family: "Bebas Neue", sans-serif; font-size: 1.35rem; color: var(--gold); text-decoration: none; }
    button.logout { background: none; border: 0; color: rgba(255,255,255,.5); cursor: pointer; font-size: .8rem; }
    main { max-width: 56rem; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
    .hero-row { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; }
    .avatar {
      width: 4.5rem; height: 4.5rem; border-radius: 999px; object-fit: cover;
      border: 2px solid var(--gold); background: #123; flex-shrink: 0;
    }
    .avatar-ph { display: grid; place-items: center; font-family: Bebas Neue, sans-serif; color: var(--gold); font-size: 1.4rem; }
    .avatar-box { display: flex; flex-direction: column; align-items: center; gap: .45rem; flex-shrink: 0; }
    .btn-photo {
      font-family: Oswald, sans-serif; font-size: .65rem; letter-spacing: .1em; text-transform: uppercase;
      padding: .35rem .65rem; border-radius: 2px; cursor: pointer; border: 1px solid var(--gold);
      background: rgba(245,197,24,.15); color: var(--gold);
    }
    .btn-photo:hover { background: var(--gold); color: var(--dark); }
    .photo-msg { font-size: .7rem; color: var(--neon); min-height: 1em; }
    h1 { font-family: "Bebas Neue", sans-serif; font-size: clamp(1.7rem, 5vw, 2.3rem); }
    .sub { color: rgba(255,255,255,.55); font-size: .85rem; margin-top: .2rem; }
    .grid { display: grid; gap: .75rem; margin-top: 1rem; }
    @media (min-width: 640px) { .grid.stats { grid-template-columns: repeat(3, 1fr); } }
    .card { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); padding: 1rem; border-radius: 3px; }
    .card small { font-family: Oswald, sans-serif; font-size: .65rem; letter-spacing: .15em; text-transform: uppercase; color: rgba(255,255,255,.4); }
    .card strong { display: block; margin-top: .35rem; font-family: Oswald, sans-serif; color: var(--gold); }
    .badge { display: inline-block; margin-top: .5rem; padding: .2rem .55rem; border-radius: 2px; font-size: .65rem; letter-spacing: .1em; text-transform: uppercase; background: rgba(16,185,129,.2); color: #6ee7b7; border: 1px solid rgba(52,211,153,.4); }
    .match { margin-top: 1.25rem; padding: 1.1rem; border-radius: 3px; border: 1px solid rgba(245,197,24,.35); background: linear-gradient(90deg, rgba(245,197,24,.12), transparent); }
    .sections h2 { font-family: Oswald, sans-serif; font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: var(--neon); margin: 1.5rem 0 .75rem; }
    .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6rem; }
    @media (min-width: 640px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 900px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
    a.tile {
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
      padding: .9rem .75rem; border-radius: 3px; color: rgba(255,255,255,.9); text-decoration: none; font-size: .85rem;
      display: block;
    }
    a.tile:hover { border-color: rgba(245,197,24,.45); color: var(--gold); }
    .bell { font-size: .7rem; color: var(--neon); margin-left: .35rem; }
    nav.bottom { position: fixed; bottom: 0; inset-inline: 0; height: 4rem; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid rgba(255,255,255,.1); background: rgba(10,31,16,.97); }
    @media (min-width: 768px) { nav.bottom { display: none; } body { padding-bottom: 0; } }
    nav.bottom a { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: rgba(255,255,255,.5); font-family: Oswald, sans-serif; font-size: .58rem; letter-spacing: .06em; text-transform: uppercase; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/portal/player">MCC · Player Portal</a>
    <div style="display:flex;gap:.75rem;align-items:center">
      <a href="/policy" style="color:#F5C518;text-decoration:none;font-size:.75rem;font-family:Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase">Policy</a>
      <button class="logout" type="button" id="logout">Logout</button>
    </div>
  </header>
  <main>
    <div id="loading" style="color:rgba(255,255,255,.5)">Loading…</div>
    <div id="dash" hidden>
      <div class="hero-row">
        <div class="avatar-box">
          <img class="avatar" id="avatar" alt="" hidden />
          <div class="avatar avatar-ph" id="avatar-ph">MCC</div>
          <input type="file" id="photo-input" accept="image/*" hidden />
          <button type="button" class="btn-photo" id="change-photo">Change Photo</button>
          <div class="photo-msg" id="photo-msg"></div>
        </div>
        <div>
          <h1 id="welcome"></h1>
          <p class="sub" id="meta"></p>
        </div>
      </div>
      <div class="grid stats">
        <div class="card"><small>Role</small><strong id="role"></strong></div>
        <div class="card"><small>Playing as</small><strong id="playing"></strong></div>
        <div class="card"><small>Team</small><strong id="team"></strong></div>
        <div class="card"><small>Category</small><strong id="category"></strong></div>
        <div class="card"><small>Phone</small><strong id="phone"></strong></div>
        <div class="card"><small>Status</small><span class="badge" id="status"></span></div>
      </div>
      <div class="match" id="match-box" hidden>
        <small style="font-family:Oswald,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);font-size:.65rem">Upcoming Match</small>
        <p id="match" style="margin-top:.5rem;font-family:Oswald,sans-serif;font-size:1.1rem"></p>
      </div>
      <a href="/policy" style="display:block;margin-top:1.25rem;border:1px solid rgba(245,197,24,.35);border-radius:3px;overflow:hidden;text-decoration:none">
        <img src="/static/images/mcc-tournament-policy.png" alt="Tournament Policy" style="width:100%;height:auto;display:block;max-height:220px;object-fit:cover;object-position:top" />
        <div style="padding:.75rem 1rem;background:rgba(245,197,24,.1);color:#F5C518;font-family:Oswald,sans-serif;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase">
          Tournament Policy — English + اردو · Read &amp; Follow →
        </div>
      </a>
      <div class="sections">
        <h2>My Dashboard <span class="bell" id="unread"></span></h2>
        <div class="tiles" id="sections"></div>
      </div>
    </div>
  </main>
  <nav class="bottom">
    <a href="/portal/player">Home</a>
    <a href="/portal/player/profile">Profile</a>
    <a href="/login">Account</a>
  </nav>
  <script>
    const token = localStorage.getItem("mcc_access_token");
    if (!token) location.replace("/login");
    document.getElementById("logout").onclick = () => {
      localStorage.clear();
      location.href = "/login";
    };

    function setAvatar(src) {
      const img = document.getElementById("avatar");
      const ph = document.getElementById("avatar-ph");
      if (src) {
        img.src = src;
        img.hidden = false;
        ph.hidden = true;
      }
    }

    document.getElementById("change-photo").onclick = () => {
      document.getElementById("photo-input").click();
    };
    document.getElementById("photo-input").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const msg = document.getElementById("photo-msg");
      msg.textContent = "Saving…";
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = async () => {
          const max = 480;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            const scale = Math.min(max / w, max / h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.72);
          try {
            const res = await fetch("/api/portal/player/avatar", {
              method: "POST",
              headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
              body: JSON.stringify({ image_data_url: dataUrl }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              msg.textContent = data.detail || "Upload failed";
              msg.style.color = "#fca5a5";
              return;
            }
            setAvatar(data.profile_picture);
            msg.style.color = "#7CFF3A";
            msg.textContent = "Photo saved";
          } catch (err) {
            msg.textContent = "Upload failed";
            msg.style.color = "#fca5a5";
          }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    fetch("/api/portal/player/dashboard", { headers: { Authorization: "Bearer " + token } })
      .then(async (r) => {
        if (r.status === 401) { location.replace("/login"); return null; }
        if (!r.ok) throw new Error("Failed to load");
        return r.json();
      })
      .then((d) => {
        if (!d) return;
        document.getElementById("loading").hidden = true;
        document.getElementById("dash").hidden = false;
        document.getElementById("welcome").textContent = "Welcome, " + d.welcome_name;
        document.getElementById("meta").textContent = [d.playing_role, d.category].filter(Boolean).join(" · ");
        document.getElementById("role").textContent = d.role_label;
        document.getElementById("playing").textContent = d.playing_role || "—";
        document.getElementById("team").textContent = d.team || "—";
        document.getElementById("category").textContent = d.category || "—";
        document.getElementById("phone").textContent = d.phone || "—";
        document.getElementById("status").textContent = d.status;
        if (d.profile_picture) setAvatar(d.profile_picture);
        if (d.upcoming_match) {
          document.getElementById("match-box").hidden = false;
          document.getElementById("match").textContent = d.upcoming_match;
        }
        if (d.unread_notifications) {
          document.getElementById("unread").textContent = "(" + d.unread_notifications + " new)";
        }
        const box = document.getElementById("sections");
        (d.sections || []).forEach((s) => {
          const a = document.createElement("a");
          a.className = "tile";
          a.href = s.href || "#";
          a.textContent = s.label || s;
          box.appendChild(a);
        });
      })
      .catch((e) => {
        document.getElementById("loading").textContent = e.message;
      });
  </script>
</body>
</html>
