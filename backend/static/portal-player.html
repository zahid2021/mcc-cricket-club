<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Player Portal | MCC</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#F5C518; --neon:#7CFF3A; --dark:#06140a; --night:#0a1f10; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "DM Sans", system-ui, sans-serif; background: var(--dark); color: #fff; min-height: 100svh; padding-bottom: 4.5rem; }
    header {
      position: sticky; top: 0; z-index: 40; height: 3.5rem;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1rem; background: rgba(10,31,16,.95); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .logo { font-family: "Bebas Neue", sans-serif; font-size: 1.4rem; color: var(--gold); text-decoration: none; }
    button.logout {
      background: none; border: 0; color: rgba(255,255,255,.5); cursor: pointer; font-size: .8rem;
    }
    button.logout:hover { color: var(--gold); }
    main { max-width: 56rem; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
    h1 { font-family: "Bebas Neue", sans-serif; font-size: clamp(1.8rem, 5vw, 2.4rem); letter-spacing: .03em; }
    .grid { display: grid; gap: .75rem; margin-top: 1rem; }
    @media (min-width: 640px) { .grid.stats { grid-template-columns: repeat(3, 1fr); } }
    .card {
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
      padding: 1rem; border-radius: 3px;
    }
    .card small { font-family: Oswald, sans-serif; font-size: .65rem; letter-spacing: .15em; text-transform: uppercase; color: rgba(255,255,255,.4); }
    .card strong { display: block; margin-top: .35rem; font-family: Oswald, sans-serif; color: var(--gold); }
    .badge {
      display: inline-block; margin-top: .5rem; padding: .2rem .55rem; border-radius: 2px;
      font-size: .65rem; letter-spacing: .1em; text-transform: uppercase;
      background: rgba(16,185,129,.2); color: #6ee7b7; border: 1px solid rgba(52,211,153,.4);
    }
    .badge.suspended { background: rgba(245,158,11,.2); color: #fcd34d; border-color: rgba(245,158,11,.4); }
    .badge.banned { background: rgba(239,68,68,.2); color: #fca5a5; border-color: rgba(239,68,68,.4); }
    .match {
      margin-top: 1.25rem; padding: 1.1rem; border-radius: 3px;
      border: 1px solid rgba(245,197,24,.35);
      background: linear-gradient(90deg, rgba(245,197,24,.12), transparent);
    }
    .sections { margin-top: 1.75rem; }
    .sections h2 { font-family: Oswald, sans-serif; font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: var(--neon); margin-bottom: .75rem; }
    .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6rem; }
    @media (min-width: 640px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 900px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
    .tile {
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
      padding: .9rem .75rem; border-radius: 3px; text-align: left; color: rgba(255,255,255,.85);
      font-size: .85rem; cursor: default;
    }
    .loading, .error { margin-top: 2rem; color: rgba(255,255,255,.5); }
    .error { color: #fca5a5; }
    nav.bottom {
      position: fixed; bottom: 0; inset-inline: 0; height: 4rem;
      display: grid; grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid rgba(255,255,255,.1); background: rgba(10,31,16,.97);
    }
    @media (min-width: 768px) { nav.bottom { display: none; } body { padding-bottom: 0; } }
    nav.bottom a {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem;
      text-decoration: none; color: rgba(255,255,255,.5); font-family: Oswald, sans-serif;
      font-size: .6rem; letter-spacing: .08em; text-transform: uppercase;
    }
    nav.bottom a:hover { color: var(--gold); }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">MCC · Player Portal</a>
    <button class="logout" type="button" id="logout">Logout</button>
  </header>
  <main>
    <div class="loading" id="loading">Loading dashboard…</div>
    <div class="error" id="error" hidden></div>
    <div id="dash" hidden>
      <h1 id="welcome"></h1>
      <div class="grid stats">
        <div class="card"><small>Role</small><strong id="role"></strong></div>
        <div class="card"><small>Team</small><strong id="team"></strong></div>
        <div class="card"><small>Status</small><span class="badge" id="status"></span></div>
      </div>
      <div class="match" id="match-box" hidden>
        <small style="font-family:Oswald,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);font-size:.65rem">Upcoming Match</small>
        <p id="match" style="margin-top:.5rem;font-family:Oswald,sans-serif;font-size:1.1rem"></p>
      </div>
      <div class="sections">
        <h2>My Dashboard</h2>
        <div class="tiles" id="sections"></div>
      </div>
    </div>
  </main>
  <nav class="bottom">
    <a href="/portal/player">Home</a>
    <a href="#match-box">Matches</a>
    <a href="#team">Team</a>
    <a href="#sections">Alerts</a>
    <a href="/login">Profile</a>
  </nav>
  <script>
    const token = localStorage.getItem("mcc_access_token");
    if (!token) location.replace("/login");

    document.getElementById("logout").onclick = () => {
      localStorage.removeItem("mcc_access_token");
      localStorage.removeItem("mcc_refresh_token");
      location.href = "/login";
    };

    fetch("/api/portal/player/dashboard", {
      headers: { Authorization: "Bearer " + token },
    })
      .then(async (r) => {
        if (r.status === 401) { location.replace("/login"); return null; }
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          throw new Error(j.detail || "Failed to load dashboard");
        }
        return r.json();
      })
      .then((data) => {
        if (!data) return;
        document.getElementById("loading").hidden = true;
        document.getElementById("dash").hidden = false;
        document.getElementById("welcome").textContent = "Welcome, " + data.welcome_name;
        document.getElementById("role").textContent = data.role_label;
        document.getElementById("team").textContent = data.team || "—";
        const st = document.getElementById("status");
        st.textContent = data.status;
        if (data.status === "SUSPENDED") st.classList.add("suspended");
        if (data.status === "BANNED") st.classList.add("banned");
        if (data.upcoming_match) {
          document.getElementById("match-box").hidden = false;
          document.getElementById("match").textContent = data.upcoming_match;
        }
        const box = document.getElementById("sections");
        (data.sections || []).forEach((s) => {
          const d = document.createElement("div");
          d.className = "tile";
          d.textContent = s;
          box.appendChild(d);
        });
      })
      .catch((e) => {
        document.getElementById("loading").hidden = true;
        const er = document.getElementById("error");
        er.hidden = false;
        er.textContent = e.message;
      });
  </script>
</body>
</html>
