<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Player Portal | MCC</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#F5C518; --neon:#7CFF3A; --dark:#06140a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "DM Sans", system-ui, sans-serif; background: var(--dark); color: #fff; min-height: 100svh; }
    header { height: 3.5rem; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; border-bottom: 1px solid rgba(255,255,255,.1); background: #0a1f10; position: sticky; top: 0; z-index: 20; }
    .logo { font-family: Bebas Neue, sans-serif; color: var(--gold); text-decoration: none; font-size: 1.25rem; }
    button.logout { background: none; border: 0; color: rgba(255,255,255,.5); cursor: pointer; font-size: .8rem; }
    main { max-width: 40rem; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; }
    .banner {
      display: none; margin-bottom: 1rem; padding: .75rem 1rem; border-radius: 3px;
      border: 1px solid rgba(124,255,58,.4); background: rgba(124,255,58,.12); color: #bbf7d0; font-size: .9rem;
    }
    .banner.show { display: block; }
    .hero { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .avatar {
      width: 6rem; height: 6rem; border-radius: 999px; object-fit: cover;
      border: 2px solid var(--gold); background: #0d3d18; display: block; flex-shrink: 0;
    }
    h1 { font-family: "Bebas Neue", sans-serif; font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1; }
    .sub { color: rgba(255,255,255,.55); font-size: .9rem; margin-top: .35rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0 1.5rem; }
    .btn {
      display: inline-block; padding: .7rem 1.1rem; border: 0; border-radius: 3px; cursor: pointer;
      font-family: Oswald, sans-serif; letter-spacing: .1em; text-transform: uppercase; font-size: .8rem; text-decoration: none;
    }
    .btn-gold { background: var(--gold); color: var(--dark); }
    .btn-gold:hover { background: var(--neon); }
    .btn-outline { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
    .btn-outline:hover { background: rgba(245,197,24,.15); }
    #photo { display: none; }
    .grid { display: grid; gap: .65rem; }
    @media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
    .card { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); padding: .85rem 1rem; border-radius: 3px; }
    .card small { display: block; font-family: Oswald, sans-serif; font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.4); }
    .card strong { display: block; margin-top: .3rem; font-size: .95rem; color: #fff; font-weight: 500; word-break: break-word; }
    .badge { display: inline-block; margin-top: .35rem; padding: .2rem .55rem; border-radius: 2px; font-size: .65rem; letter-spacing: .1em; text-transform: uppercase; background: rgba(16,185,129,.2); color: #6ee7b7; border: 1px solid rgba(52,211,153,.4); }
    .msg { margin-top: .75rem; font-size: .85rem; color: var(--neon); min-height: 1.2em; }
    .err { color: #fca5a5; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/portal/player">MCC · Player Portal</a>
    <div style="display:flex;gap:.75rem;align-items:center">
      <a href="/" style="color:rgba(255,255,255,.55);text-decoration:none;font-size:.75rem;font-family:Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase">Home</a>
      <a href="/policy" style="color:#F5C518;text-decoration:none;font-size:.75rem;font-family:Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase">Policy</a>
      <button class="logout" type="button" id="logout">Logout</button>
    </div>
  </header>
  <main>
    <div class="banner" id="banner">Profile saved</div>
    <div id="loading" style="color:rgba(255,255,255,.5)">Loading portal…</div>
    <div id="view" hidden>
      <p style="font-family:Oswald,sans-serif;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.35rem">Aapki Profile</p>
      <div class="hero">
        <img class="avatar" id="avatar" alt="Profile" width="96" height="96" />
        <div>
          <h1 id="name">—</h1>
          <p class="sub" id="meta">—</p>
          <span class="badge" id="status">—</span>
        </div>
      </div>
      <div class="actions">
        <a class="btn btn-gold" href="/portal/player/profile">Edit Profile</a>
        <button type="button" class="btn btn-outline" id="btn-photo">Change Photo</button>
        <input type="file" id="photo" accept="image/*" />
      </div>
      <p style="font-size:.8rem;color:rgba(255,255,255,.4);margin:-.5rem 0 1rem">Edit karna ho to <b style="color:#F5C518">Edit Profile</b> dabao. Save ke baad yahi profile pe wapas aaoge.</p>
      <p class="msg" id="msg"></p>
      <div class="grid" id="cards"></div>
    </div>
  </main>
  <script src="/static/js/mcc-photo-crop.js"></script>
  <script>
    if (!localStorage.getItem("mcc_access_token")) location.replace("/login?next=/portal/player");
    try { history.replaceState({ mccPortal: 1 }, "", "/portal/player"); } catch (e) {}

    document.getElementById("logout").onclick = () => {
      localStorage.clear();
      location.replace("/portal");
    };

    const MCC_LOGO = "data:image/svg+xml," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="#0d3d18" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="#F5C518" font-size="28" font-family="sans-serif">MCC</text></svg>'
    );
    const params = new URLSearchParams(location.search);
    if (params.get("saved") === "1") {
      document.getElementById("banner").textContent = "Profile saved — aap Player Portal pe ho";
      document.getElementById("banner").classList.add("show");
      history.replaceState({}, "", "/portal/player");
    }
    if (params.get("photo") === "1") {
      document.getElementById("banner").textContent = "Photo saved — aap Player Portal pe ho";
      document.getElementById("banner").classList.add("show");
      history.replaceState({}, "", "/portal/player");
    }

    function getToken() { return localStorage.getItem("mcc_access_token"); }

    async function refreshSession() {
      const rt = localStorage.getItem("mcc_refresh_token");
      if (!rt) return false;
      try {
        const res = await fetch("/api/auth/refresh", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ refresh_token: rt }),
        });
        if (!res.ok) return false;
        const data = await res.json();
        localStorage.setItem("mcc_access_token", data.access_token);
        if (data.refresh_token) localStorage.setItem("mcc_refresh_token", data.refresh_token);
        return true;
      } catch (e) { return false; }
    }

    async function api(url, options) {
      const opts = options || {};
      opts.headers = Object.assign({}, opts.headers || {}, { Authorization: "Bearer " + getToken() });
      let res = await fetch(url, opts);
      if (res.status === 401) {
        if (await refreshSession()) {
          opts.headers.Authorization = "Bearer " + getToken();
          res = await fetch(url, opts);
        }
      }
      return res;
    }

    function setAvatar(src) {
      document.getElementById("avatar").src = (src && String(src).startsWith("data:image/")) ? src : MCC_LOGO;
    }

    function card(label, value) {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `<small>${label}</small><strong>${value || "—"}</strong>`;
      return el;
    }

    async function load() {
      const r = await api("/api/portal/player/profile");
      document.getElementById("loading").hidden = true;
      if (r.status === 401) {
        localStorage.clear();
        location.replace("/login?next=/portal/player");
        return;
      }
      if (!r.ok) {
        document.getElementById("msg").className = "msg err";
        document.getElementById("msg").textContent = "Profile load failed";
        return;
      }
      const p = await r.json();
      document.getElementById("view").hidden = false;
      setAvatar(p.profile_picture);
      document.getElementById("name").textContent = p.full_name || "Player";
      document.getElementById("meta").textContent = [p.playing_role, p.leadership_label, p.category].filter(Boolean).join(" · ") || "—";
      document.getElementById("status").textContent = p.status || "—";
      const box = document.getElementById("cards");
      box.innerHTML = "";
      [
        ["Player ID", p.player_code],
        ["Username", p.username],
        ["Email", p.email],
        ["Phone", p.phone],
        ["Address", p.address],
        ["Emergency", p.emergency_contact],
        ["Date of birth", p.date_of_birth],
        ["Category", p.category],
        ["Team", p.team],
        ["Club position", p.leadership_label],
        ["Playing role", p.playing_role],
        ["Jersey number", p.jersey_number != null ? String(p.jersey_number) : ""],
        ["Batting style", p.batting_style],
        ["Bowling style", p.bowling_style],
        ["Status", p.status],
      ].forEach(([k, v]) => box.appendChild(card(k, v)));
    }

    const photoInput = document.getElementById("photo");
    document.getElementById("btn-photo").onclick = () => photoInput.click();
    photoInput.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      photoInput.value = "";
      if (!file) return;
      const msg = document.getElementById("msg");
      if (!window.openMccPhotoCrop) {
        msg.className = "msg err";
        msg.textContent = "Photo editor load nahi hua. Refresh karo.";
        return;
      }
      const dataUrl = await openMccPhotoCrop(file);
      if (!dataUrl) {
        msg.className = "msg err";
        msg.textContent = "Photo cancel — dubara Change Photo se set karo.";
        return;
      }
      msg.className = "msg";
      msg.textContent = "Saving photo…";
      setAvatar(dataUrl);
      try {
        const res = await api("/api/portal/player/avatar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image_data_url: dataUrl }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          msg.className = "msg err";
          msg.textContent = data.detail || "Photo save failed";
          return;
        }
        location.replace("/portal/player?photo=1");
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "Photo save failed";
      }
    });

    load();
  </script>
</body>
</html>
