<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Member Login | Mustafa Cricket Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#F5C518; --neon:#7CFF3A; --dark:#06140a; --night:#0a1f10; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh; font-family: "DM Sans", system-ui, sans-serif;
      background: var(--dark);
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(57,255,20,.15), transparent 55%),
        radial-gradient(ellipse at 80% 100%, rgba(245,197,24,.1), transparent 40%);
      color: #fff; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .wrap { width: 100%; max-width: 26rem; }
    .brand { text-align: center; margin-bottom: 1.75rem; }
    .badge {
      width: 3.5rem; height: 3.5rem; border-radius: 999px; margin: 0 auto;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--gold), #E8A317);
      color: var(--dark); font-family: "Bebas Neue", sans-serif; font-size: 1.35rem;
      box-shadow: 0 0 28px rgba(245,197,24,.4);
    }
    .brand a { text-decoration: none; color: inherit; }
    .brand h1 { margin-top: 1rem; font-family: "Bebas Neue", sans-serif; font-size: 2.4rem; letter-spacing: .04em; }
    .brand p { margin-top: .35rem; font-size: .85rem; color: rgba(255,255,255,.55); }
    .card {
      border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04);
      padding: 1.5rem; border-radius: 4px;
    }
    label {
      display: block; font-family: Oswald, sans-serif; font-size: .7rem;
      letter-spacing: .15em; text-transform: uppercase; color: rgba(255,255,255,.5); margin-bottom: .4rem;
    }
    input[type=text], input[type=password], input[type=email] {
      width: 100%; padding: .7rem .85rem; margin-bottom: 1rem;
      border: 1px solid rgba(255,255,255,.15); border-radius: 3px;
      background: rgba(0,0,0,.4); color: #fff; font-size: .95rem; outline: none;
    }
    input:focus { border-color: var(--gold); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: 1.25rem; font-size: .85rem; }
    .row label { display: flex; align-items: center; gap: .4rem; margin: 0; text-transform: none; letter-spacing: 0; font-family: inherit; color: rgba(255,255,255,.6); cursor: pointer; }
    .row a { color: var(--gold); text-decoration: none; font-size: .8rem; }
    .row a:hover { color: var(--neon); }
    button {
      width: 100%; padding: .85rem; border: 0; border-radius: 3px; cursor: pointer;
      background: var(--gold); color: var(--dark);
      font-family: Oswald, sans-serif; font-size: .85rem; letter-spacing: .15em; text-transform: uppercase;
    }
    button:hover { background: var(--neon); }
    button:disabled { opacity: .6; cursor: wait; }
    .err {
      display: none; margin-bottom: 1rem; padding: .65rem .75rem;
      border: 1px solid rgba(239,68,68,.45); background: rgba(239,68,68,.12);
      color: #fecaca; font-size: .85rem; border-radius: 3px;
    }
    .err.show { display: block; }
    .ok {
      display: none; margin-bottom: 1rem; padding: .65rem .75rem;
      border: 1px solid rgba(124,255,58,.45); background: rgba(124,255,58,.12);
      color: #bbf7d0; font-size: .85rem; border-radius: 3px;
    }
    .ok.show { display: block; }
    .hint { margin-top: 1rem; font-size: .75rem; color: rgba(255,255,255,.4); text-align: center; line-height: 1.5; }
    .back { display: block; margin-top: 1.25rem; text-align: center; color: rgba(255,255,255,.45); text-decoration: none; font-size: .8rem; }
    .back:hover { color: var(--gold); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <a href="/">
        <div class="badge">MCC</div>
        <p style="margin-top:.75rem;font-family:Oswald,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);font-size:.7rem">Mustafa Cricket Club</p>
        <h1>MEMBER LOGIN</h1>
        <p>Players, captains, coaches &amp; staff</p>
      </a>
    </div>
    <form class="card" id="login-form">
      <div class="ok" id="ok"></div>
      <div class="err" id="err"></div>
      <label for="identifier">Username or email</label>
      <input id="identifier" name="identifier" type="text" autocomplete="username" required placeholder="you@gmail.com" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
      <div class="row">
        <label><input type="checkbox" id="remember" checked /> Remember session</label>
        <a href="/signup">Need an account?</a>
      </div>
      <button type="submit" id="submit">Sign in</button>
      <p class="hint">Demo: <b>mali</b> / Player@MCC2026 · <b>admin</b> / admin</p>
      <p class="hint" style="margin-top:.75rem">New here? <a href="/signup" style="color:var(--gold)">Create an account</a></p>
      <p class="hint" style="margin-top:.5rem"><a href="/policy" style="color:var(--neon)">Tournament Policy (EN + اردو)</a></p>
    </form>
    <a class="back" href="/">← Back to public site</a>
  </div>
  <script>
    function portalPathFor(role) {
      if (["super_admin", "club_admin"].includes(role)) return "/portal/admin";
      if (["captain", "vice_captain", "coach", "team_manager", "scorer"].includes(role)) return "/portal/staff";
      return "/portal/player";
    }

    function safeNext() {
      const n = new URLSearchParams(location.search).get("next") || "";
      if (n === "/portal/player" || n === "/portal/admin" || n === "/portal/staff") return n;
      return null;
    }

    // Logged-in bounce — admin next pe sirf admin role jaaye
    async function bounceToPortalIfLoggedIn() {
      const t = localStorage.getItem("mcc_access_token");
      if (!t) return false;
      try {
        let res = await fetch("/api/auth/me", { headers: { Authorization: "Bearer " + t } });
        if (res.status === 401) {
          const rt = localStorage.getItem("mcc_refresh_token");
          if (!rt) return false;
          const rr = await fetch("/api/auth/refresh", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ refresh_token: rt }),
          });
          if (!rr.ok) return false;
          const d = await rr.json();
          localStorage.setItem("mcc_access_token", d.access_token);
          if (d.refresh_token) localStorage.setItem("mcc_refresh_token", d.refresh_token);
          res = await fetch("/api/auth/me", { headers: { Authorization: "Bearer " + d.access_token } });
        }
        if (!res.ok) return false;
        const u = await res.json();
        const role = u.primary_role || "player";
        const next = safeNext();
        const isAdmin = ["super_admin", "club_admin"].includes(role);

        if (next === "/portal/admin") {
          if (isAdmin) {
            location.replace("/portal/admin");
            return true;
          }
          // Player session — login form dikhao taake admin se login ho
          return false;
        }

        location.replace(next || portalPathFor(role));
        return true;
      } catch (e) {
        return false;
      }
    }

    bounceToPortalIfLoggedIn();
    window.addEventListener("pageshow", function () {
      bounceToPortalIfLoggedIn();
    });

    const form = document.getElementById("login-form");
    const err = document.getElementById("err");
    const ok = document.getElementById("ok");
    const btn = document.getElementById("submit");
    const params = new URLSearchParams(location.search);
    if (params.get("registered") === "1") {
      ok.textContent = "Account created successfully. Now login with the same email & password.";
      ok.classList.add("show");
    }
    if (params.get("need_admin") === "1" || params.get("next") === "/portal/admin") {
      ok.textContent = "Admin Dashboard: username admin · password admin";
      ok.classList.add("show");
      document.getElementById("identifier").value = "admin";
      document.getElementById("password").focus();
    }
    if (params.get("email")) {
      document.getElementById("identifier").value = params.get("email");
      document.getElementById("password").focus();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.classList.remove("show");
      btn.disabled = true;
      btn.textContent = "Signing in…";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            identifier: document.getElementById("identifier").value.trim(),
            password: document.getElementById("password").value,
            remember_me: document.getElementById("remember").checked,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          err.textContent = data.detail || "Invalid credentials";
          err.classList.add("show");
          return;
        }
        localStorage.setItem("mcc_access_token", data.access_token);
        if (data.refresh_token) localStorage.setItem("mcc_refresh_token", data.refresh_token);
        const role = (data.user && data.user.primary_role) || "player";
        const next = safeNext();
        let dest = portalPathFor(role);
        if (next === "/portal/admin") {
          if (["super_admin", "club_admin"].includes(role)) dest = "/portal/admin";
          else {
            err.textContent = "Yeh account admin nahi hai. admin / admin se login karein.";
            err.classList.add("show");
            return;
          }
        } else if (next) {
          dest = next;
        }
        location.replace(dest === "/portal/player/profile" ? "/portal/player" : dest);
      } catch (ex) {
        err.textContent = "Unable to reach server. Try again.";
        err.classList.add("show");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
