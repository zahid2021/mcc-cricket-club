<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile | MCC</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#F5C518; --neon:#7CFF3A; --dark:#06140a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "DM Sans", system-ui, sans-serif; background: var(--dark); color: #fff; min-height: 100svh; }
    header { height: 3.5rem; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; border-bottom: 1px solid rgba(255,255,255,.1); background: #0a1f10; position: sticky; top: 0; z-index: 20; }
    .logo { font-family: Bebas Neue, sans-serif; color: var(--gold); text-decoration: none; font-size: 1.25rem; }
    button.logout { background: none; border: 0; color: rgba(255,255,255,.5); cursor: pointer; font-size: .8rem; }
    main { max-width: 40rem; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; }
    h1 { font-family: "Bebas Neue", sans-serif; font-size: 2rem; margin-bottom: .35rem; }
    .hint { color: rgba(255,255,255,.45); font-size: .85rem; margin-bottom: 1.25rem; }
    .avatar-wrap { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .avatar {
      width: 5.5rem; height: 5.5rem; border-radius: 999px; object-fit: cover;
      border: 2px solid var(--gold); background: #0d3d18; display: block;
    }
    .btn-change {
      display: inline-block; margin-top: .35rem; padding: .55rem 1rem; border: 0; border-radius: 3px;
      background: var(--gold); color: var(--dark); font-family: Oswald, sans-serif; letter-spacing: .1em;
      text-transform: uppercase; cursor: pointer; font-size: .8rem;
    }
    .btn-change:hover { background: var(--neon); }
    #photo { display: none; }
    label { display: block; font-family: Oswald, sans-serif; font-size: .65rem; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.45); margin: .7rem 0 .3rem; }
    input, select, textarea { width: 100%; padding: .65rem .8rem; border: 1px solid rgba(255,255,255,.15); border-radius: 3px; background: rgba(0,0,0,.4); color: #fff; font: inherit; }
    .ro { opacity: .75; }
    button.save { margin-top: 1.1rem; width: 100%; padding: .85rem; border: 0; border-radius: 3px; background: var(--gold); color: var(--dark); font-family: Oswald, sans-serif; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; font-size: .95rem; }
    button.save:hover { background: var(--neon); }
    .msg { margin-top: .75rem; font-size: .85rem; color: var(--neon); display: none; }
    .msg.show { display: block; }
    .err { color: #fca5a5; }
    .badge { display: inline-block; margin-top: .35rem; padding: .25rem .6rem; border-radius: 2px; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; background: rgba(16,185,129,.2); color: #6ee7b7; border: 1px solid rgba(52,211,153,.4); }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/portal/player">MCC · My Profile</a>
    <div style="display:flex;gap:.75rem;align-items:center">
      <a href="/policy" style="color:#F5C518;text-decoration:none;font-size:.75rem;font-family:Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase">Policy</a>
      <button class="logout" type="button" id="logout">Logout</button>
    </div>
  </header>
  <main>
    <h1>My Profile</h1>
    <p class="hint">Update your details. Photo replaces MCC logo when set.</p>
    <div class="avatar-wrap">
      <img class="avatar" id="avatar" alt="Profile" width="88" height="88" />
      <div>
        <p style="font-family:Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase;font-size:.75rem;color:rgba(255,255,255,.55)">Profile picture</p>
        <input type="file" id="photo" accept="image/*" />
        <button type="button" class="btn-change" id="btn-change">Change Photo</button>
        <p id="photo-hint" style="font-size:.75rem;color:rgba(255,255,255,.4);margin-top:.45rem">Tap Change Photo to update · saved to database</p>
      </div>
    </div>
    <form id="form">
      <label>Full name</label>
      <input id="full_name" required />
      <label>Email</label>
      <input id="email" class="ro" readonly />
      <label>Username</label>
      <input id="username" class="ro" readonly />
      <label>Player ID</label>
      <input id="player_code" class="ro" readonly />
      <label>Phone</label>
      <input id="phone" />
      <label>Address</label>
      <textarea id="address" rows="2"></textarea>
      <label>Emergency contact</label>
      <input id="emergency_contact" placeholder="Name / phone" />
      <label>Date of birth</label>
      <input id="date_of_birth" type="date" />
      <label>Category</label>
      <input id="category" class="ro" readonly />
      <label>Team</label>
      <input id="team" class="ro" readonly />
      <label>Playing role</label>
      <select id="playing_role">
        <option value="batsman">Batsman</option>
        <option value="bowler">Bowler</option>
        <option value="all_rounder">All-rounder</option>
        <option value="wicketkeeper">Wicketkeeper</option>
      </select>
      <label>Jersey number</label>
      <input id="jersey_number" type="number" min="1" max="99" />
      <label>Batting style</label>
      <input id="batting_style" placeholder="Right-hand bat" />
      <label>Bowling style</label>
      <input id="bowling_style" placeholder="Right-arm medium" />
      <label>Status</label>
      <div><span class="badge" id="status">—</span></div>
      <button type="submit" class="save">Save profile</button>
      <p class="msg" id="msg"></p>
    </form>
  </main>
  <script>
    const token = localStorage.getItem("mcc_access_token");
    if (!token) location.replace("/login");
    document.getElementById("logout").onclick = () => {
      localStorage.clear();
      location.href = "/login";
    };

    const MCC_LOGO = "data:image/svg+xml," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="#0d3d18" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="#F5C518" font-size="28" font-family="sans-serif">MCC</text></svg>'
    );
    const avatarEl = document.getElementById("avatar");
    const msg = document.getElementById("msg");
    const photoHint = document.getElementById("photo-hint");

    function show(t, isErr) {
      msg.textContent = t;
      msg.className = "msg show" + (isErr ? " err" : "");
    }

    function getToken() {
      return localStorage.getItem("mcc_access_token");
    }

    async function refreshSession() {
      const rt = localStorage.getItem("mcc_refresh_token");
      if (!rt) return false;
      try {
        const res = await fetch("/api/auth/refresh", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ refresh_token: rt }),
        });
        if (!res.ok) return false;
        const data = await res.json();
        if (!data.access_token) return false;
        localStorage.setItem("mcc_access_token", data.access_token);
        if (data.refresh_token) localStorage.setItem("mcc_refresh_token", data.refresh_token);
        return true;
      } catch (e) {
        return false;
      }
    }

    async function api(url, options) {
      const opts = options || {};
      opts.headers = Object.assign({}, opts.headers || {}, {
        Authorization: "Bearer " + getToken(),
      });
      let res = await fetch(url, opts);
      if (res.status === 401) {
        const ok = await refreshSession();
        if (!ok) {
          localStorage.clear();
          location.replace("/login");
          throw new Error("Please login again");
        }
        opts.headers.Authorization = "Bearer " + getToken();
        res = await fetch(url, opts);
      }
      return res;
    }

    function setAvatar(src) {
      if (src && String(src).startsWith("data:image/")) {
        avatarEl.src = src;
        avatarEl.dataset.hasPhoto = "1";
        photoHint.textContent = "Photo set · MCC logo hidden · saved";
        photoHint.style.color = "#7CFF3A";
      } else {
        avatarEl.src = MCC_LOGO;
        avatarEl.dataset.hasPhoto = "0";
        photoHint.textContent = "Tap Change Photo to update · saved to database";
        photoHint.style.color = "rgba(255,255,255,.4)";
      }
    }

    function roleValue(label) {
      if (!label) return "batsman";
      const l = String(label).toLowerCase();
      if (l.includes("bowl")) return "bowler";
      if (l.includes("keep")) return "wicketkeeper";
      if (l.includes("all")) return "all_rounder";
      return "batsman";
    }

    function toDateInput(val) {
      if (!val) return "";
      const s = String(val).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (m) {
        const d = m[1].padStart(2, "0");
        const mo = m[2].padStart(2, "0");
        return m[3] + "-" + mo + "-" + d;
      }
      return "";
    }

    function detailText(data) {
      if (!data) return "Save failed";
      if (typeof data.detail === "string") return data.detail;
      if (Array.isArray(data.detail)) return data.detail.map((x) => x.msg || JSON.stringify(x)).join(", ");
      return "Save failed";
    }

    document.getElementById("btn-change").onclick = () => document.getElementById("photo").click();

    async function load() {
      const r = await api("/api/portal/player/profile");
      if (!r.ok) { show(detailText(await r.json().catch(() => ({}))), true); return; }
      const p = await r.json();
      setAvatar(p.profile_picture);
      ["full_name","email","username","player_code","phone","address","emergency_contact","category","team","batting_style","bowling_style"].forEach((k) => {
        const el = document.getElementById(k);
        if (el) el.value = p[k] || "";
      });
      document.getElementById("date_of_birth").value = toDateInput(p.date_of_birth);
      document.getElementById("jersey_number").value = p.jersey_number || "";
      document.getElementById("playing_role").value = roleValue(p.playing_role);
      document.getElementById("status").textContent = p.status || "—";
    }

    document.getElementById("photo").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = async () => {
          const max = 480;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            const scale = Math.min(max / w, max / h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.72);
          if (dataUrl.length > 850000) {
            show("Image still too large. Try another photo.", true);
            return;
          }
          setAvatar(dataUrl);
          show("Saving photo…");
          try {
            const res = await api("/api/portal/player/avatar", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ image_data_url: dataUrl }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              show(detailText(data), true);
              return;
            }
            setAvatar(data.profile_picture || dataUrl);
            show("Photo saved");
          } catch (err) {
            show(err.message || "Upload failed", true);
          }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = {
        full_name: document.getElementById("full_name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        address: document.getElementById("address").value.trim(),
        emergency_contact: document.getElementById("emergency_contact").value.trim(),
        date_of_birth: document.getElementById("date_of_birth").value.trim(),
        batting_style: document.getElementById("batting_style").value.trim(),
        bowling_style: document.getElementById("bowling_style").value.trim(),
        playing_role: document.getElementById("playing_role").value,
        jersey_number: document.getElementById("jersey_number").value
          ? Number(document.getElementById("jersey_number").value)
          : null,
      };
      show("Saving…");
      try {
        const res = await api("/api/portal/player/profile", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          show(detailText(data), true);
          return;
        }
        show("Profile saved");
        if (data.profile_picture) setAvatar(data.profile_picture);
        document.getElementById("status").textContent = data.status || document.getElementById("status").textContent;
      } catch (err) {
        show(err.message || "Save failed", true);
      }
    });

    load();
  </script>
</body>
</html>
