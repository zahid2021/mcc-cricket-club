<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard | MCC</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#F5C518; --neon:#7CFF3A; --dark:#06140a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "DM Sans", system-ui, sans-serif; background: var(--dark); color: #fff; min-height: 100svh; }
    header { height: 3.5rem; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; border-bottom: 1px solid rgba(255,255,255,.1); background: #0a1f10; }
    .logo { font-family: "Bebas Neue", sans-serif; color: var(--gold); font-size: 1.3rem; text-decoration: none; }
    a.out { color: rgba(255,255,255,.5); text-decoration: none; font-size: .8rem; }
    main { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1rem; }
    h1 { font-family: "Bebas Neue", sans-serif; font-size: 2rem; }
    .muted { color: rgba(255,255,255,.5); font-size: .9rem; margin-top: .35rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; margin-top: 1.5rem; }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    .card { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); padding: 1rem; border-radius: 3px; }
    .card small { font-family: Oswald, sans-serif; font-size: .65rem; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.4); }
    .card strong { display: block; margin-top: .4rem; font-family: "Bebas Neue", sans-serif; font-size: 1.6rem; color: var(--neon); }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">MCC Admin</a>
    <a class="out" href="/" id="logout">Logout</a>
  </header>
  <main>
    <h1 id="title">Admin Dashboard</h1>
    <p class="muted" id="sub">Loading…</p>
    <div class="grid" id="cards"></div>
  </main>
  <script>
    const token = localStorage.getItem("mcc_access_token");
    if (!token) location.replace("/login");
    document.getElementById("logout").onclick = (e) => {
      e.preventDefault();
      localStorage.clear();
      location.href = "/login";
    };
    const labels = ["Total Players","Senior","Junior","Active","Suspended","Banned","Upcoming Matches","Tournaments","Sponsors","Income","Expenses","Pending"];
    const box = document.getElementById("cards");
    labels.forEach((l) => {
      const d = document.createElement("div");
      d.className = "card";
      d.innerHTML = "<small>" + l + "</small><strong>—</strong>";
      box.appendChild(d);
    });
    fetch("/api/auth/me", { headers: { Authorization: "Bearer " + token } })
      .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
      .then((u) => {
        document.getElementById("title").textContent = "Welcome, " + u.full_name;
        document.getElementById("sub").textContent = "Role: " + (u.primary_role || "").replaceAll("_", " ");
      })
      .catch(() => location.replace("/login"));
  </script>
</body>
</html>
